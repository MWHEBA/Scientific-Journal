{% extends 'base_public.html' %}

{% block title %}المؤتمرات العلمية{% endblock %}

<div class="page-header">
    <h1 class="page-header__title">المؤتمرات العلمية</h1>
</div>

<div class="card">
    <div class="empty-state">
        <div class="empty-state__icon"><svg class="icon icon-xl icon-muted"><use href="#icon-conferences"/></svg></div>

        </p>
    </div>
